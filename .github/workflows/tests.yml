name: Tests

# Runs only when started by hand: Actions tab -> Tests -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer run replaces an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Chrome is preinstalled on ubuntu-latest; Selenium Manager fetches the driver.
      - name: Run tests
        run: mvn -B test -Dheadless=true

      # The steps below also run when tests fail, so the report shows the failures.
      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            target/report/
            target/surefire-reports/*.xml
            target/screenshots/
          if-no-files-found: ignore

      - name: Prepare Pages content
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/report

      - name: Publish report to GitHub Pages
        id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v5
